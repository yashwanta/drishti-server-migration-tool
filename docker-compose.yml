services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hypershift
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: hypershift
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypershift"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DRISHTI_MODE: mock
      DRISHTI_HTTP_ADDR: ":8080"
      DRISHTI_DB_URL: "postgres://hypershift:changeme@postgres:5432/hypershift?sslmode=disable"
      DRISHTI_LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DRISHTI_WORKER_ADDR: ":8090"
      DRISHTI_LOG_LEVEL: info
    ports:
      - "8090:8090"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: